[workspace]
resolver = "3"
members = [
  "backend/crates/catalog",
  "backend/crates/storage",
  "backend/crates/telemetry",
  "backend/crates/watchkeep",
]

[workspace.package]
version = "0.4.0"
edition = "2024"
license = "MIT"
publish = false

# Every crate takes its dependency versions from here (`name.workspace = true`).
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"

[workspace.dependencies]
axum = { version = "0.8.9", features = ["multipart"] }
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
color-eyre = "0.6.5"
console-subscriber = "0.5.0"
eyre = "0.6.14"
futures = "0.3.34"
http = "1.4.0"
http-body-util = "0.1.5"
indexmap = "2.14.2"
# The three opentelemetry crates stay on one minor version. `tracing-opentelemetry`
# 0.33 pairs with 0.32 of them; read its changelog before a bump.
opentelemetry = "0.32.0"
opentelemetry-otlp = { version = "0.32.0", default-features = false, features = [
  "http-proto",
  "reqwest-blocking-client",
  "trace",
  "metrics",
  "internal-logs",
] }
opentelemetry_sdk = "0.32.1"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = [
  "json",
  "rustls",
] }
reqwest-middleware = "0.5.2"
# `opentelemetry_0_32` pairs with `tracing-opentelemetry` 0.33, the same pair as above.
reqwest-tracing = { version = "0.7.1", default-features = false, features = [
  "opentelemetry_0_32",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", default-features = false, features = [
  "runtime-tokio",
  "tls-rustls-aws-lc-rs",
  "postgres",
  "derive",
  "macros",
  "migrate",
  "sqlx-toml",
  "chrono",
  "uuid",
] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full", "tracing"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["fs", "trace"] }
ts-rs = { version = "12.0.1", features = ["chrono-impl", "uuid-impl"] }
tracing = "0.1.44"
tracing-error = "0.2.1"
tracing-opentelemetry = { version = "0.33.0", features = ["metrics"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.26.1", features = ["v7", "serde"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
watchkeep-catalog = { path = "backend/crates/catalog" }
watchkeep-storage = { path = "backend/crates/storage" }
watchkeep-telemetry = { path = "backend/crates/telemetry" }
