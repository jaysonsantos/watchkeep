# A version tag (v1.2.3) starts this workflow. The tag comes from
# release-tag.yml or from a local `scripts/release.sh`. The workflow builds the
# image for linux/amd64 and linux/arm64 and pushes it to GHCR as
# ghcr.io/<owner>/watchkeep:1.2.3, :1.2, and :latest, then publishes the GitHub
# release with the notes that the tag carries.
# The Dockerfile cross-compiles the arm64 binary, so one amd64 runner builds both.
#
# This workflow answers the tag only. It never makes one. Two triggers on one
# workflow would run it twice per release, because the deploy key push of
# release-tag.yml does start a workflow.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # One manifest per platform, without the attestation entries.
          provenance: false

  release:
    needs: image
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          # The whole history, because the notes come from the annotated tag.
          fetch-depth: 0

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          # `%(contents)`, because git takes the first line of the annotation as the
          # subject and `%(contents:body)` would drop the first heading of the notes.
          git tag --list "$TAG" --format='%(contents)' |
            gh release create "$TAG" --verify-tag --title "$TAG" --notes-file -
