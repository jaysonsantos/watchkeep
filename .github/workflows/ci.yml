# Every push and pull request runs the linters, the backend tests, and the frontend tests
# and build. The tools come from the nix flake, the same as on a developer machine.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push on the same ref cancels the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The linters need no database, so they run beside the tests.
  lint:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: DeterminateSystems/nix-installer-action@main

      # The Biome and the svelte-check hooks read node_modules.
      - name: Install the frontend packages
        run: nix develop --command pnpm install --frozen-lockfile

      - name: Lint
        run: nix develop --command prek run --all-files --show-diff-on-failure

  # Only the backend tests need a database, so the service runs on this job.
  test-backend:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    services:
      postgres:
        image: ghcr.io/jaysonsantos/bunderwar:postgres-17.10
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -h 127.0.0.1"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      # The tests create and drop their own databases on this server.
      WATCHKEEP_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v5

      - uses: DeterminateSystems/nix-installer-action@main

      - name: Test the backend
        run: nix develop --command cargo test --workspace

  # The frontend needs no database, so this job runs beside the other jobs.
  test-frontend:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: DeterminateSystems/nix-installer-action@main

      - name: Install the frontend packages
        run: nix develop --command pnpm install --frozen-lockfile

      - name: Test the frontend
        run: nix develop --command pnpm test

      - name: Build the frontend
        run: nix develop --command pnpm build

  # The branch ruleset requires the context `check`. This guard reports that
  # name and fails when any of the jobs above did not succeed.
  check:
    name: check
    if: always()
    needs: [lint, test-backend, test-frontend]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check the result of every job
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          echo "$RESULTS" | jq --exit-status 'all(.[].result; . == "success")' > /dev/null
