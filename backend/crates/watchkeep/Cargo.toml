[package]
name = "watchkeep"
description = "Self-hosted watch history tracker for movies and TV shows with Plex webhook scrobbling."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "watchkeep"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
axum.workspace = true
chrono.workspace = true
clap.workspace = true
color-eyre.workspace = true
eyre.workspace = true
futures.workspace = true
indexmap.workspace = true
opentelemetry.workspace = true
regex.workspace = true
reqwest.workspace = true
reqwest-middleware.workspace = true
reqwest-tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-opentelemetry.workspace = true
ts-rs.workspace = true
uuid.workspace = true
watchkeep-catalog.workspace = true
watchkeep-storage.workspace = true
watchkeep-telemetry.workspace = true
zip.workspace = true

[dev-dependencies]
http-body-util.workspace = true
tower.workspace = true
# `testing::init_goodies` builds the production layers for the tests.
watchkeep-telemetry = { workspace = true, features = ["testing"] }
