[package]
name = "watchkeep-telemetry"
description = "Tracing, OTLP export, metrics, and error reporting for the Watchkeep binary."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Test setup (`testing::init_goodies`). The integration tests enable it; the binary does not.
testing = []

[dependencies]
color-eyre.workspace = true
console-subscriber.workspace = true
eyre.workspace = true
http.workspace = true
opentelemetry.workspace = true
opentelemetry-otlp.workspace = true
opentelemetry-semantic-conventions.workspace = true
opentelemetry_sdk.workspace = true
tracing.workspace = true
tracing-error.workspace = true
tracing-opentelemetry.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
# `testing` brings `InMemorySpanExporter`, which holds the spans of a test.
opentelemetry_sdk = { workspace = true, features = ["testing"] }
# The end-to-end test runs a real statement on a real server.
sqlx.workspace = true
tokio.workspace = true
